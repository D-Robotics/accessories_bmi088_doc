name: Update Algolia DocSearch Index

# 在文档同步到 OSS（线上站点）成功后更新索引；也支持手动触发。
# Write/Admin API Key 仅通过 GitHub Secrets 注入，切勿写入仓库文件。
on:
  workflow_run:
    workflows: ["Sync gh-pages to OSS"]
    types:
      - completed
  workflow_dispatch:

jobs:
  algolia-index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Admin/Write API Key secret is configured
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: |
          if [ -z "$ALGOLIA_ADMIN_API_KEY" ]; then
            echo "::error::Missing repository secret ALGOLIA_ADMIN_API_KEY"
            echo "Add it in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      # 给 OSS/CDN 一点传播时间，再抓取线上站点
      - name: Wait for published site to settle
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 45

      - name: Install dependencies
        run: npm ci

      - name: Crawl live site and update Algolia index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: npm run algolia:index

      - name: Setup ossutil v2
        run: |
          if [ ! -x "$HOME/ossutil" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
            unzip ossutil.zip
            cd ossutil-2.1.2-linux-amd64
            chmod 755 ossutil
            mv ossutil "$HOME/ossutil"
          fi

      # 覆盖式单文件上传：覆盖 OSS 上残留的旧 search-index.json（8 月过期产物）。
      # 不能带 -r / --update（那只会增不删），必须覆盖根下同名文件。
      - name: Upload easyops search-index.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ~/ossutil cp -f scripts/_algolia_tmp/search-index.json \
            oss://cn-rdk-front-prod/accessories_bmi088_doc/search-index.json \
            -e https://d-robotics.cc \
            -i $OSS_ACCESS_KEY_ID \
            -k $OSS_ACCESS_KEY_SECRET \
            --region cn-beijing \
            --retry-times=3
